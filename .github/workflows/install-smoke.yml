name: install-smoke

# Post-release acceptance (PER-70): install the PUBLISHED packages in clean
# environments across OSes and parse a real PDF. Run manually after a release:
#   Actions → install-smoke → Run workflow → version = 0.1.4
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to test (e.g. 0.1.4)"
        required: true

jobs:
  pip:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - shell: bash
        run: |
          pip install "pdfmuse==${{ inputs.version }}"
          python -c "import pdfmuse._native as n, json; d=json.loads(n.parse_bytes(open('tests/corpus/hello.pdf','rb').read(), None)); assert d['source']=='Pdf' and d['pages']; print('pip ok', len(d['pages']), 'page(s)')"

  npm-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          npm init -y >/dev/null
          npm i "@pdfmuse/node@${{ inputs.version }}"
          node -e "const {parse}=require('@pdfmuse/node');const fs=require('fs');const d=parse(fs.readFileSync('tests/corpus/hello.pdf'));if(d.source!=='Pdf'||!d.pages.length)process.exit(1);console.log('npm-native ok',d.pages.length,'page(s)')"

  # ESM entry point (browsers, bundlers, Node ESM): async init(bytes).
  npm-wasm-esm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - shell: bash
        run: |
          npm init -y >/dev/null
          npm i "@pdfmuse/core@${{ inputs.version }}"
          cat > smoke.mjs <<'EOF'
          import init, { parse } from "@pdfmuse/core";
          import { readFileSync } from "node:fs";
          import { fileURLToPath } from "node:url";
          await init({ module_or_path: readFileSync(fileURLToPath(new URL("./node_modules/@pdfmuse/core/pdfmuse_wasm_bg.wasm", import.meta.url))) });
          const d = JSON.parse(parse(new Uint8Array(readFileSync("tests/corpus/hello.pdf"))));
          if (d.source !== "Pdf" || !d.pages.length) process.exit(1);
          console.log("npm-wasm-esm ok", d.pages.length, "page(s)");
          EOF
          node smoke.mjs

  # CJS entry point (CJS-only Node hosts: bundled serverless runtimes,
  # TypeScript compiled to commonjs). No init() — synchronous at require.
  #
  # Node 18 is the floor, and it is set by the wasm module, not the JS: the
  # `reference-types` and `multivalue` proposals are on by default for
  # wasm32-unknown-unknown since Rust 1.82 and required by current wasm-bindgen.
  # Node 16 fails to compile the module ("invalid value type 'externref'"), and
  # Node 14 fails earlier still ("return count of 4 exceeds internal limit").
  # Keep 18 pinned here so a toolchain bump that raises the floor again is caught
  # by CI rather than by a user's runtime.
  npm-wasm-cjs:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - shell: bash
        run: |
          npm init -y >/dev/null
          npm i "@pdfmuse/core@${{ inputs.version }}"
          cat > smoke.cjs <<'EOF'
          const { parse, to_text } = require("@pdfmuse/core");
          const { readFileSync } = require("fs");
          const bytes = new Uint8Array(readFileSync("tests/corpus/hello.pdf"));
          const d = JSON.parse(parse(bytes));
          if (d.source !== "Pdf" || !d.pages.length) process.exit(1);
          if (!to_text(bytes).includes("Hello pdfmuse")) process.exit(1);
          console.log("npm-wasm-cjs ok", d.pages.length, "page(s)");
          EOF
          node smoke.cjs

  cargo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - shell: bash
        run: |
          pdf="$PWD/tests/corpus/hello.pdf"
          cargo new smoke && cd smoke
          cargo add "pdfmuse-core@${{ inputs.version }}"
          cat > src/main.rs <<'EOF'
          fn main() {
              let data = std::fs::read(std::env::args().nth(1).unwrap()).unwrap();
              let doc = pdfmuse_core::parse(&data, None).unwrap();
              assert!(!doc.pages.is_empty());
              println!("cargo ok {} page(s)", doc.pages.len());
          }
          EOF
          cargo run --release -- "$pdf"
